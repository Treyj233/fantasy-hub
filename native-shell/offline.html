<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#073b27" />
    <title>Fantasy Hub is offline</title>
    <style>
      *{box-sizing:border-box}body{margin:0;color:#fff;background:radial-gradient(circle at 75% 15%,#4c8a4f55,transparent 34%),linear-gradient(145deg,#061c13,#073b27);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{min-height:100vh;display:grid;place-items:center;padding:max(28px,env(safe-area-inset-top)) 24px max(28px,env(safe-area-inset-bottom));text-align:center}.card{width:min(420px,100%);padding:34px 26px;background:#ffffff0d;border:1px solid #ffffff21;border-radius:22px;box-shadow:0 24px 70px #0005}.mark{display:grid;width:68px;height:68px;margin:0 auto 18px;place-items:center;color:#073b27;background:#f2bd37;border-radius:18px;font-size:22px;font-weight:950}.card h1{margin:0;font-size:27px}.card p{margin:10px 0 22px;color:#c6d9cc;font-size:14px;line-height:1.55}.card button{width:100%;padding:13px;color:#073b27;background:#f2bd37;border:0;border-radius:11px;font-size:15px;font-weight:900}
    </style>
  </head>
  <body>
    <main class="shell"><section class="card"><div class="mark">FH</div><h1>Your Hub is offline</h1><p>Reconnect to load current leagues, scores, injuries, and recommendations.</p><button onclick="location.reload()">Try again</button></section></main>
  </body>
</html>
