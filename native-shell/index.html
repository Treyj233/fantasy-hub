<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0080c6" />
    <title>Fantasy Hub</title>
    <style>
      *{box-sizing:border-box}body{margin:0;background:#001f47;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{min-height:100vh;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom));text-align:center;background:radial-gradient(circle at 82% 18%,rgba(255,194,14,.3),transparent 27%),linear-gradient(145deg,#001f47,#005a9c 55%,#0080c6)}.mark{display:grid;width:72px;height:72px;margin:0 auto 18px;place-items:center;color:#001f47;background:#ffc20e;border-radius:17px;box-shadow:0 14px 34px rgba(0,17,43,.4);font-size:23px;font-weight:950}.title{display:block;font-size:22px}.status{display:block;margin-top:8px;color:#d9effb}.bar{width:150px;height:4px;margin:20px auto 0;overflow:hidden;background:#ffffff2b;border-radius:99px}.bar:after{display:block;width:45%;height:100%;content:"";background:#ffc20e;border-radius:inherit;animation:load 1.1s ease-in-out infinite}@keyframes load{from{transform:translateX(-110%)}to{transform:translateX(330%)}}@media(prefers-reduced-motion:reduce){.bar:after{width:70%;animation:none}}
    </style>
  </head>
  <body>
    <main class="shell">
      <div>
        <div class="mark" aria-hidden="true">FH</div>
        <b class="title">Fantasy Hub</b>
        <span class="status">Opening your leagues…</span>
        <div class="bar" aria-hidden="true"></div>
      </div>
    </main>
    <script>
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          location.replace("https://fantasyhubapp.com/native-app");
        });
      });
    </script>
  </body>
</html>
